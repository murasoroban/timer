          '<span class="pill pending"><span class="dot"></span>承認待ち</span>';
        var actions = r.status === "pending"
          ? '<button type="button" class="btn btn-primary btn-sm" data-approve="' + esc(r.id) + '">承認</button><button type="button" class="btn btn-danger btn-sm" data-reject="' + esc(r.id) + '">差し戻し</button>'
          : '<button type="button" class="btn btn-outline btn-sm" data-reset="' + esc(r.id) + '">承認待ちに戻す</button>';
        return "<tr><td>" + esc(formatDateShort(r.date)) + "</td><td>" + esc(r.instructorName) + "</td><td class=\"num\">" + esc(r.komaCount) + "コマ</td><td class=\"cell-note\">" + esc(r.note || "—") + "</td><td>" + pill + '</td><td class="row-actions">' + actions + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    el.querySelectorAll("[data-approve]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-approve");
        var report = byId(state.workReports, id);
        state.db.collection("workReports").doc(id).update({ status: "approved", decidedAt: Date.now(), adminNote: "" }).then(function () {
          toast("承認しました");
          notifyWorkReportDecision(report, "approved");
        });
      });
    });
    el.querySelectorAll("[data-reject]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-reject");
        var cell = b.parentElement;
        cell.innerHTML =
          '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
          '<input type="text" class="rejectReasonInput" placeholder="理由(任意)" style="width:130px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-900);">' +
          '<button type="button" class="btn btn-danger btn-sm" data-confirm-reject>差し戻す</button>' +
          '<button type="button" class="btn btn-outline btn-sm" data-cancel-reject>キャンセル</button>' +
          "</div>";
        cell.querySelector("[data-confirm-reject]").addEventListener("click", function () {
          var reason = cell.querySelector(".rejectReasonInput").value.trim();
          var report = byId(state.workReports, id);
          state.db.collection("workReports").doc(id).update({ status: "rejected", decidedAt: Date.now(), adminNote: reason }).then(function () {
            toast("差し戻しました");
            notifyWorkReportDecision(report, "rejected", reason);
          });
        });
        cell.querySelector("[data-cancel-reject]").addEventListener("click", function () { updateApprovalsList(); });
      });
    });
    el.querySelectorAll("[data-reset]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.db.collection("workReports").doc(b.getAttribute("data-reset")).update({ status: "pending", adminNote: "" }).then(function () { toast("承認待ちに戻しました"); });
      });
    });
  }

  /* 実績の承認・差し戻しが決まったときに、講師本人へアプリ内お知らせを送る。
     notifications に emailSent:false で追加すると、既存のメール配信の
     仕組みがそのままメール送信も行ってくれる。 */
  function notifyWorkReportDecision(report, status, reason) {
    if (!report || !report.instructorId) return;
    var title = status === "approved" ? "実績が承認されました" : "実績が差し戻されました";
    var body = formatDateJp(report.date) + "(" + report.komaCount + "コマ)の提出について、" +
      (status === "approved" ? "承認されました。" : "差し戻されました。内容をご確認のうえ、再提出をお願いします。");
    if (reason) body += "\n理由: " + reason;
    state.db.collection("notifications").add({
      title: title,
      body: body,
      targetInstructorId: report.instructorId,
      createdAt: Date.now(),
      createdBy: state.myName,
      readBy: [],
      emailSent: false
    }).catch(function () {});
  }

  function updateAdminNoticesList() {
    var el = document.getElementById("list-adminNotices");
    if (!el) return;
    var list = state.notifications.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (list.length === 0) { el.innerHTML = '<div class="empty-state">まだお知らせを送信していません</div>'; return; }
    el.innerHTML = list.map(function (n) {
      var target = n.targetInstructorId ? esc(instructorName(n.targetInstructorId)) + "さん宛" : "全員宛";
      var readCount = Array.isArray(n.readBy) ? n.readBy.length : 0;
      var when = n.createdAt ? new Date(n.createdAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      return '<div class="notice-card">' +
        '<div class="notice-title">' + esc(n.title) + "</div>" +
        '<div class="notice-meta">' + target + " ・ " + esc(when) + " ・ 既読 " + readCount + "件</div>" +
        '<div class="notice-body">' + esc(n.body) + "</div>" +
        '<div class="row-actions" style="margin-top:8px;"><button type="button" class="btn btn-danger btn-sm" data-del-notice="' + esc(n.id) + '">削除</button></div>' +
      "</div>";
    }).join("");
    el.querySelectorAll("[data-del-notice]").forEach(function (b) {
      b.addEventListener("click", function () {
        onDangerClick(b, "もう一度押すと削除", function () {
          state.db.collection("notifications").doc(b.getAttribute("data-del-notice")).delete().then(function () { toast("削除しました"); });
        });
      });
    });
  }

  /* 講師からの連絡を管理者が開いたタイミングで、未読のものをまとめて
     既読にする(講師側のお知らせを開いたときの動きと同じ考え方)。 */
  function markInstructorMessagesRead() {
    if (state.role !== "admin") return;
    var unread = state.instructorMessages.filter(function (m) { return !m.read; });
    unread.forEach(function (m) {
      state.db.collection("instructorMessages").doc(m.id).update({ read: true }).catch(function () {});
    });
  }

  function updateAdminInstructorMessagesList() {
    var el = document.getElementById("list-instructorMsgs");
    if (!el) return;
    markInstructorMessagesRead();
    var list = state.instructorMessages.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (list.length === 0) { el.innerHTML = '<div class="empty-state">講師からの連絡はまだありません</div>'; return; }
    el.innerHTML = list.map(function (m) {
      var when = m.createdAt ? new Date(m.createdAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      return '<div class="notice-card' + (m.read ? "" : " unread") + '">' +
        '<div class="notice-title">' + esc(m.instructorName || instructorName(m.instructorId)) + "さんより</div>" +
        '<div class="notice-meta">' + esc(when) + "</div>" +
        '<div class="notice-body">' + esc(m.body) + "</div>" +
        '<div class="row-actions" style="margin-top:8px;"><button type="button" class="btn btn-danger btn-sm" data-del-instmsg="' + esc(m.id) + '">削除</button></div>' +
      "</div>";
    }).join("");
    el.querySelectorAll("[data-del-instmsg]").forEach(function (b) {
      b.addEventListener("click", function () {
        onDangerClick(b, "もう一度押すと削除", function () {
          state.db.collection("instructorMessages").doc(b.getAttribute("data-del-instmsg")).delete().then(function () { toast("削除しました"); });
        });
      });
    });
  }

  function updateInstructorAdminList() {
    var el = document.getElementById("list-instructors");
    if (!el) return;
    var list = state.instructors.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "ja"); });
    if (list.length === 0) { el.innerHTML = '<div class="empty-state">まだ講師が登録されていません</div>'; return; }
    el.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th>講師名</th><th>メールアドレス</th><th>単価(円/コマ)</th><th>今月コマ数</th><th>累計コマ数</th><th>アカウント</th><th>状態</th><th></th></tr></thead><tbody>' +
      list.map(function (i) {
        return "<tr><td>" + esc(i.name) + '</td><td><input type="email" class="emailInput" style="width:190px;" value="' + esc(i.email || "") + '" placeholder="未設定" data-email-id="' + esc(i.id) + '"></td><td><input type="number" class="rateInput" min="0" step="10" style="width:100px;" value="' + esc(i.rate || 0) + '" data-rate-id="' + esc(i.id) + '"></td>' +
          '<td class="num">' + instructorApprovedKoma(i.id, thisMonthStr()) + "コマ</td>" +
          '<td class="num">' + instructorApprovedKoma(i.id) + "コマ</td><td>" +
          (i.authUid ? '<span class="pill approved"><span class="dot"></span>登録済み</span>' : '<span class="pill pending"><span class="dot"></span>未登録</span>') +
          '</td><td>' +
          (i.active === false ? '<span class="pill off"><span class="dot"></span>無効</span>' : '<span class="pill approved"><span class="dot"></span>有効</span>') +
          '</td><td class="row-actions">' +
          (i.active === false
            ? '<button type="button" class="btn btn-outline btn-sm" data-activate="' + esc(i.id) + '">有効にする</button>'
            : '<button type="button" class="btn btn-outline btn-sm" data-deactivate="' + esc(i.id) + '">無効にする</button>') +
          '<button type="button" class="btn btn-danger btn-sm" data-del-inst="' + esc(i.id) + '">削除</button>' +
          "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="hint" style="margin-top:10px;">「未登録」の講師は、まだご自身でアカウントを作成していません。ログイン画面でお名前を選んでパスワードを決めていただくと「登録済み」になります。登録済みの方のメールアドレスをここで書き換えても、ログイン用のメールアドレスは変わりません(連絡先メモとしてのみ使われます)。</p>';
    el.querySelectorAll(".emailInput").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var v = inp.value.trim();
        if (!v) {
          var inst = byId(state.instructors, inp.getAttribute("data-email-id"));
          inp.value = (inst && inst.email) || "";
          toast("メールアドレスは空にできません", true);
          return;
        }
        state.db.collection("instructors").doc(inp.getAttribute("data-email-id")).update({ email: v }).then(function () { toast("メールアドレスを更新しました"); });
      });
    });
    el.querySelectorAll(".rateInput").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var v = Number(inp.value) || 0;
        state.db.collection("instructors").doc(inp.getAttribute("data-rate-id")).update({ rate: v }).then(function () { toast("単価を更新しました"); });
      });
    });
    el.querySelectorAll("[data-activate]").forEach(function (b) {
      b.addEventListener("click", function () { state.db.collection("instructors").doc(b.getAttribute("data-activate")).update({ active: true }).then(function () { toast("有効にしました"); }); });
    });
    el.querySelectorAll("[data-deactivate]").forEach(function (b) {
      b.addEventListener("click", function () { state.db.collection("instructors").doc(b.getAttribute("data-deactivate")).update({ active: false }).then(function () { toast("無効にしました"); }); });
    });
    el.querySelectorAll("[data-del-inst]").forEach(function (b) {
      b.addEventListener("click", function () {
        onDangerClick(b, "もう一度押すと削除", function () {
          state.db.collection("instructors").doc(b.getAttribute("data-del-inst")).delete().then(function () { toast("削除しました"); });
        });
      });
    });
  }

  function payrollForMonth(month) {
    var approved = state.workReports.filter(function (r) { return r.status === "approved" && r.date.slice(0, 7) === month; });
    var byInst = {};
    approved.forEach(function (r) {
      var key = r.instructorId || r.instructorName;
      if (!byInst[key]) byInst[key] = { instructorId: r.instructorId, instructorName: r.instructorName, koma: 0 };
      byInst[key].koma += Number(r.komaCount || 0);
    });
    return Object.keys(byInst).map(function (k) {
      var row = byInst[k];
      var rate = instructorRate(row.instructorId);
      return { instructorId: row.instructorId, instructorName: row.instructorName, koma: row.koma, rate: rate, pay: row.koma * rate };
    }).sort(function (a, b) { return String(a.instructorName).localeCompare(String(b.instructorName), "ja"); });
  }

  /* この月分の給与が確定通知済みかどうかを表示するだけの補助表示。
     判定は、finalizePayrollMonth() が payrollMonth 付きで作ったお知らせの有無で行う。 */
  function updatePayrollFinalizedNote(month) {
    var el = document.getElementById("payrollFinalizedNote");
    if (!el) return;
    var notices = state.notifications.filter(function (n) { return n.payrollMonth === month; });
    if (notices.length === 0) { el.textContent = ""; return; }
    var latest = notices.reduce(function (a, n) { return (n.createdAt || 0) > (a.createdAt || 0) ? n : a; });
    var when = latest.createdAt ? new Date(latest.createdAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    el.textContent = monthLabelJp(month) + "分は確定済みです(" + when + " に" + notices.length + "件通知)。内容を直した場合は、もう一度ボタンを押すと再通知されます。";
  }

  /* この月の承認済み実績から給与を計算し、対象の講師それぞれに
     「給与確定」のお知らせ(アプリ内 + メール)を個別に送る。 */
  function finalizePayrollMonth() {
    var monthEl = document.getElementById("payrollMonth");
    var month = monthEl ? monthEl.value : thisMonthStr();
    var rows = payrollForMonth(month).filter(function (r) { return r.instructorId && r.koma > 0; });
    if (rows.length === 0) { toast("この月の確定済み実績がありません", true); return; }
    var tasks = rows.map(function (r) {
      return state.db.collection("notifications").add({
        title: monthLabelJp(month) + "分の給与が確定しました",
        body: "承認済みコマ数: " + r.koma + "コマ\n給与額: " + yen(r.pay) + "\n(単価 " + yen(r.rate) + " / コマ)",
        targetInstructorId: r.instructorId,
        createdAt: Date.now(),
        createdBy: state.myName,
        readBy: [],
        emailSent: false,
        payrollMonth: month
      });
    });
    Promise.all(tasks).then(function () {
      toast(rows.length + "件の講師に給与確定の通知を送信しました");
    }).catch(function () {
      toast("一部の通知送信に失敗しました。もう一度お試しください。", true);
    });
  }

  function updatePayrollTable() {
    var el = document.getElementById("payrollTable");
    if (!el) return;
    var monthEl = document.getElementById("payrollMonth");
    var month = monthEl ? monthEl.value : thisMonthStr();
    updatePayrollFinalizedNote(month);
    var rows = payrollForMonth(month);
    if (rows.length === 0) { el.innerHTML = '<div class="empty-state">この月の承認済み実績はまだありません</div>'; return; }
    var total = rows.reduce(function (a, r) { return a + r.pay; }, 0);
    el.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th>講師</th><th>承認済みコマ数</th><th>単価</th><th>給与額</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return "<tr><td>" + esc(r.instructorName) + "</td><td class=\"num\">" + r.koma + "コマ</td><td class=\"num\">" + yen(r.rate) + "</td><td class=\"num\"><strong>" + yen(r.pay) + "</strong></td></tr>";
      }).join("") +
      '<tr><td colspan="3" style="text-align:right;font-weight:700;">合計</td><td class="num" style="font-weight:700;">' + yen(total) + "</td></tr>" +
      "</tbody></table></div>";
  }

  function csvField(v) {
    var s = v === undefined || v === null ? "" : String(v);
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportPayrollCsv() {
    var monthEl = document.getElementById("payrollMonth");
    var month = monthEl ? monthEl.value : thisMonthStr();
    var rows = payrollForMonth(month);
    if (rows.length === 0) { toast("この月の集計データがありません", true); return; }
    var lines = ["講師名,承認済みコマ数,単価,給与額"];
    rows.forEach(function (r) { lines.push([csvField(r.instructorName), r.koma, r.rate, r.pay].join(",")); });
    var total = rows.reduce(function (a, r) { return a + r.pay; }, 0);
    lines.push(["合計", "", "", total].join(","));
    var csv = "﻿" + lines.join("\r\n");
    try {
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "給与集計_" + month + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast("CSVを保存しました");
    } catch (e) {
      toast("ダウンロードに失敗しました", true);
    }
  }

  boot();
})();
</script>
</body>
</html>
