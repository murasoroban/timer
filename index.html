<meta name="description" content="そろばんオンライン講師の希望シフト・確定シフト・出勤実績・給与を一つにまとめる管理ツール">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #F2F1EA;
    --surface: #FFFFFF;
    --surface-alt: #FBFAF4;
    --ink-900: #1E2733;
    --ink-700: #34465A;
    --ink-500: #5B6B7C;
    --ink-300: #93A0AC;
    --line: #DEDACC;
    --line-soft: #EAE7DC;
    --indigo: #2B4C7E;
    --indigo-deep: #1F3A62;
    --indigo-soft: #E3EAF4;
    --vermillion: #C1502F;
    --vermillion-soft: #F7E3DA;
    --success: #2E7D4F;
    --success-soft: #DFF0E4;
    --amber: #A5730A;
    --amber-soft: #F5E7C8;
    --rose: #AE3B49;
    --rose-soft: #F5DFE1;
    --shadow: 0 1px 2px rgba(30,39,51,0.06), 0 6px 20px -8px rgba(30,39,51,0.18);
    --font-display: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171B22;
      --surface: #1F2530;
      --surface-alt: #262D3A;
      --ink-900: #ECEEF1;
      --ink-700: #C7CDD6;
      --ink-500: #9AA5B2;
      --ink-300: #6C7885;
      --line: #333C49;
      --line-soft: #2A313D;
      --indigo: #8FB0E0;
      --indigo-deep: #B7CFEF;
      --indigo-soft: #26344B;
      --vermillion: #E38F6E;
      --vermillion-soft: #3B2A22;
      --success: #7BCB9A;
      --success-soft: #1F3327;
      --amber: #E8C06B;
      --amber-soft: #3A2F17;
      --rose: #E28D97;
      --rose-soft: #3A2126;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171B22;
    --surface: #1F2530;
    --surface-alt: #262D3A;
    --ink-900: #ECEEF1;
    --ink-700: #C7CDD6;
    --ink-500: #9AA5B2;
    --ink-300: #6C7885;
    --line: #333C49;
    --line-soft: #2A313D;
    --indigo: #8FB0E0;
    --indigo-deep: #B7CFEF;
    --indigo-soft: #26344B;
    --vermillion: #E38F6E;
    --vermillion-soft: #3B2A22;
    --success: #7BCB9A;
    --success-soft: #1F3327;
    --amber: #E8C06B;
    --amber-soft: #3A2F17;
    --rose: #E28D97;
    --rose-soft: #3A2126;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink-900);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: var(--font-display); text-wrap: balance; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  table { font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--indigo); }
  ::selection { background: var(--indigo-soft); }

  [hidden] { display: none !important; }

  /* ---------- loading / gate screens ---------- */
  .gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; text-align: center; padding: 32px;
  }
  .gate .beads { display: flex; gap: 6px; }
  .bead { width: 12px; height: 12px; border-radius: 50%; background: var(--vermillion); opacity: 0.35; animation: bead-pulse 1.2s ease-in-out infinite; }
  .bead:nth-child(2) { animation-delay: .15s; }
  .bead:nth-child(3) { animation-delay: .3s; }
  .bead:nth-child(4) { animation-delay: .45s; }
  .bead:nth-child(5) { animation-delay: .6s; }
  @keyframes bead-pulse { 0%,100% { opacity:.3; transform: translateY(0);} 50% { opacity:1; transform: translateY(-4px);} }
  @media (prefers-reduced-motion: reduce) { .bead { animation: none; opacity: .8; } }
  .gate p { color: var(--ink-500); max-width: 34em; }

  /* ---------- login ---------- */
  .login-wrap {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .login-card {
    width: 100%; max-width: 760px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
  }
  .login-head { padding: 32px 36px 24px; border-bottom: 1px solid var(--line-soft); }
  .login-head .beads-row { display:flex; gap:5px; margin-bottom: 14px; }
  .login-head .beads-row span { width: 9px; height: 9px; border-radius: 50%; background: var(--vermillion); }
  .login-head .beads-row span:nth-child(4), .login-head .beads-row span:nth-child(5) { background: var(--indigo-soft); border:1px solid var(--line); }
  .login-head h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 6px; letter-spacing: .01em; }
  .login-head p { color: var(--ink-500); font-size: .9rem; margin: 0; }
  .login-body { display: grid; grid-template-columns: 1fr 1fr; }
  .login-col { padding: 26px 30px; }
  .login-col + .login-col { border-left: 1px solid var(--line-soft); }
  .login-col h2 { font-size: .78rem; font-weight: 700; color: var(--ink-500); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 14px; }
  .instructor-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
  .instructor-btn {
    text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-alt); cursor: pointer; font-size: .92rem; font-weight: 500;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: border-color .12s, background .12s;
  }
  .instructor-btn:hover { border-color: var(--indigo); background: var(--indigo-soft); }
  .instructor-btn .arrow { color: var(--ink-300); }
  .empty-note { color: var(--ink-500); font-size: .85rem; background: var(--surface-alt); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; }
  .admin-login-form { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 640px) {
    .login-wrap { padding: 20px 12px; }
    .login-card { border-radius: 14px; }
    .login-head { padding: 22px 18px 16px; }
    .login-head h1 { font-size: 1.28rem; }
    .login-head p { font-size: .85rem; }
    .login-body { grid-template-columns: 1fr; }
    .login-col { padding: 20px 18px; }
    .login-col + .login-col { border-left: none; border-top: 10px solid var(--paper); }
    .login-col h2 { margin-bottom: 12px; }
  }

  /* ---------- form controls ---------- */
  label { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-500); margin-bottom: 5px; }
  input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="month"], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface); color: var(--ink-900); outline: none;
  }

     the caller can go on to (re)finish the linking step transparently. If
     the password doesn't match, we mark the error so the caller can point
     the person at "パスワードを忘れた方はこちら" instead of leaving them stuck. */
  function beginAccount(email, password) {
    return state.auth.createUserWithEmailAndPassword(email, password)
      .then(function (cred) { return { cred: cred, created: true }; })
      .catch(function (err) {
        if (err && err.code === "auth/email-already-in-use") {
          return state.auth.signInWithEmailAndPassword(email, password)
            .then(function (cred) { return { cred: cred, created: false }; })
            .catch(function (signInErr) {
              signInErr.alreadyInUse = true;
              throw signInErr;
            });
        }
        throw err;
      });
  }
  function myUnreadNoticeCount() {
    if (state.role !== "instructor") return 0;
    return state.notifications.filter(function (n) {
      var forMe = !n.targetInstructorId || n.targetInstructorId === state.instructorId;
      var read = Array.isArray(n.readBy) && n.readBy.indexOf(state.instructorId) !== -1;
      return forMe && !read;
    }).length;
  }
  function unreadInstructorMessageCount() {
    if (state.role !== "admin") return 0;
    return state.instructorMessages.filter(function (m) { return !m.read; }).length;
  }

  /* ============ utils ============ */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function thisMonthStr() { return todayStr().slice(0, 7); }
  function formatDateJp(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var wd = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return Number(parts[0]) + "年" + Number(parts[1]) + "月" + Number(parts[2]) + "日(" + wd + ")";
  }
  function formatDateShort(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var wd = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return Number(parts[1]) + "/" + Number(parts[2]) + "(" + wd + ")";
  }
  function addMonths(monthStr, delta) {
    var y = Number(monthStr.slice(0, 4)), m = Number(monthStr.slice(5, 7));
    var d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }
  function monthLabelJp(monthStr) {
    return Number(monthStr.slice(0, 4)) + "年" + Number(monthStr.slice(5, 7)) + "月";
  }
  function yen(n) {
    var v = Math.round(Number(n) || 0);
    return "¥" + v.toLocaleString("ja-JP");
  }
  function timeRange(s, e) {
    if (!s && !e) return "";
    return (s || "?") + "〜" + (e || "?");
  }
  function toast(msg, isError) {
    var stack = document.getElementById("toastStack");
    if (!stack) return;
    var el = document.createElement("div");
    el.className = "toast" + (isError ? " error" : "");
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity .25s";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 260);
    }, 2600);
  }
  /* Artifacts run in a sandboxed frame where native confirm()/prompt() dialogs
     are not reliable, so destructive actions use a same-button "press again
     to confirm" pattern instead of window.confirm(). */
  function armConfirm(btn, label) {
    if (!btn.hasAttribute("data-original-label")) btn.setAttribute("data-original-label", btn.textContent);
    btn.setAttribute("data-confirming", "1");
    btn.textContent = label || "もう一度押すと削除します";
    btn.classList.add("confirm-armed");
    if (btn._armTimer) clearTimeout(btn._armTimer);
    btn._armTimer = setTimeout(function () {
      btn.removeAttribute("data-confirming");
      btn.textContent = btn.getAttribute("data-original-label");
      btn.classList.remove("confirm-armed");
    }, 4000);
  }
  function onDangerClick(btn, label, action) {
    if (btn.getAttribute("data-confirming") === "1") {
      if (btn._armTimer) clearTimeout(btn._armTimer);
      action();
    } else {
      armConfirm(btn, label);
    }
  }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function instructorName(id) {
    var it = byId(state.instructors, id);
    return it ? it.name : "(不明な講師)";
  }
  function instructorRate(id) {
    var it = byId(state.instructors, id);
    return it ? Number(it.rate) || 0 : 0;
  }
  function studentName(id) {
    var s = byId(state.students, id);
    return s ? s.name : "(不明な生徒)";
  }
  function studentNames(ids) {
    if (!Array.isArray(ids) || ids.length === 0) return "";
    return ids.map(studentName).join("、");
  }
  /* 生徒をチップ形式のチェックボックスで複数選択させるための共通HTML。
     idPrefix はフォームごとに要素idを衝突させないための接頭辞。 */
  function studentCheckboxesHtml(idPrefix, selectedIds) {
    var list = state.students.filter(function (s) { return s.active !== false; })
      .sort(function (a, b) { return String(a.furigana || a.name).localeCompare(String(b.furigana || b.name), "ja"); });
    if (list.length === 0) return '<p class="hint">先に「生徒情報」タブで生徒を登録すると、ここから選択できるようになります。</p>';
    var sel = selectedIds || [];
    var searchHtml = list.length > 6
      ? '<input type="text" id="' + idPrefix + 'Search" placeholder="生徒名で絞り込む" style="max-width:260px;margin-bottom:8px;">'
      : "";
    var chipsHtml = '<div class="radio-group" id="' + idPrefix + '">' + list.map(function (s) {
      var checked = sel.indexOf(s.id) !== -1;
      var searchKey = (String(s.name || "") + " " + String(s.furigana || "")).toLowerCase();
      return '<label class="radio-chip' + (checked ? " checked" : "") + '" data-search="' + esc(searchKey) + '"><input type="checkbox" value="' + esc(s.id) + '"' + (checked ? " checked" : "") + ">" + esc(s.name) + "</label>";
    }).join("") + "</div>";
    return searchHtml + chipsHtml;
  }
  function wireStudentCheckboxes(idPrefix) {
    var group = document.getElementById(idPrefix);
    if (!group) return;
    group.addEventListener("change", function () {
      group.querySelectorAll(".radio-chip").forEach(function (c) { c.classList.toggle("checked", c.querySelector("input").checked); });
    });
    var searchInput = document.getElementById(idPrefix + "Search");
    if (searchInput) {
      searchInput.addEventListener("input", function () {
        var q = searchInput.value.trim().toLowerCase();
        group.querySelectorAll(".radio-chip").forEach(function (c) {
          c.hidden = !(!q || (c.getAttribute("data-search") || "").indexOf(q) !== -1);
        });
      });
      // 検索欄でEnterを押しても、フォームがうっかり送信されないようにする。
      searchInput.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
    }
  }
  function getCheckedValues(idPrefix) {
    var group = document.getElementById(idPrefix);
    if (!group) return [];
    return Array.prototype.slice.call(group.querySelectorAll("input:checked")).map(function (i) { return i.value; });
  }
  /* form.reset()はチェックボックスの状態自体は元に戻すが、changeイベントが
     発火しないため、チップの見た目(checkedクラス)や検索による絞り込み表示が
     そのまま残ってしまう。フォームをリセットしたあとに呼んで、見た目も揃える。 */
  function resetStudentCheckboxes(idPrefix) {
    var group = document.getElementById(idPrefix);
    if (!group) return;
    group.querySelectorAll(".radio-chip").forEach(function (c) { c.classList.remove("checked"); c.hidden = false; });
    var searchInput = document.getElementById(idPrefix + "Search");
    if (searchInput) searchInput.value = "";
  }
  /* 承認済み実績のコマ数を合計する。month を指定するとその月のみ、
     省略すると全期間の累計になる。 */
  function instructorApprovedKoma(instructorId, month) {
    return state.workReports.filter(function (r) {
      return r.instructorId === instructorId && r.status === "approved" && (!month || String(r.date).slice(0, 7) === month);
    }).reduce(function (a, r) { return a + Number(r.komaCount || 0); }, 0);
  }
  function sortByDateDesc(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }
  function sortByDateAsc(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }

  /* ============ calendar component ============ */
  var calState = {
    instructor: { month: thisMonthStr(), selectedDate: todayStr() },
    admin: { month: thisMonthStr(), selectedDate: todayStr() }
  };

  function groupShiftsByDate(list) {
    var map = {};
    list.forEach(function (s) { (map[s.date] = map[s.date] || []).push(s); });
    return map;
  }

  function buildCalendarHtml(monthStr, dayShiftsMap, selectedDate, chipFn) {
    var y = Number(monthStr.slice(0, 4)), m = Number(monthStr.slice(5, 7));
    var startWeekday = new Date(y, m - 1, 1).getDay();
    var daysInMonth = new Date(y, m, 0).getDate();
    var weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];
    var head = weekdayLabels.map(function (w) { return '<div class="cal-weekday">' + w + "</div>"; }).join("");
    var cells = [];
    for (var i = 0; i < startWeekday; i++) cells.push('<div class="cal-cell cal-empty"></div>');
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = y + "-" + pad(m) + "-" + pad(d);
      var dayShifts = dayShiftsMap[dateStr] || [];
      var hasMakeup = dayShifts.some(function (s) { return s.type === "makeup"; });
      var cls = "cal-cell";
      if (dateStr === todayStr()) cls += " cal-today";
      if (dateStr === selectedDate) cls += " cal-selected";
      if (dayShifts.length) cls += " cal-has" + (hasMakeup ? " cal-has-makeup" : "");
      var chips = dayShifts.slice(0, 3).map(chipFn).join("");
      var more = dayShifts.length > 3 ? '<div class="cal-more">+' + (dayShifts.length - 3) + "件</div>" : "";
      cells.push('<button type="button" class="' + cls + '" data-cal-date="' + dateStr + '"><span class="cal-daynum">' + d + "</span>" + chips + more + "</button>");
    }
    return (
      '<div class="cal-nav">' +
        '<button type="button" class="cal-arrow" data-cal-prev aria-label="前の月">‹</button>' +
        '<span class="cal-month-label">' + esc(monthLabelJp(monthStr)) + "</span>" +
        '<button type="button" class="cal-arrow" data-cal-next aria-label="次の月">›</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-cal-today>今日</button>' +
      "</div>" +
      '<div class="cal-head-row">' + head + "</div>" +
      '<div class="cal-grid">' + cells.join("") + "</div>" +
      '<div class="cal-legend"><span><span class="sw" style="background:var(--indigo);"></span>通常シフト</span><span><span class="sw" style="background:var(--vermillion);"></span>振替授業</span></div>'
    );
  }

  function wireCalendarNav(containerEl, calKey, onChange) {
    var cs = calState[calKey];
    containerEl.querySelectorAll("[data-cal-date]").forEach(function (btn) {
      btn.addEventListener("click", function () { cs.selectedDate = btn.getAttribute("data-cal-date"); onChange(); });
    });
    var prevBtn = containerEl.querySelector("[data-cal-prev]");
    if (prevBtn) prevBtn.addEventListener("click", function () { cs.month = addMonths(cs.month, -1); onChange(); });
    var nextBtn = containerEl.querySelector("[data-cal-next]");
    if (nextBtn) nextBtn.addEventListener("click", function () { cs.month = addMonths(cs.month, 1); onChange(); });
    var todayBtn = containerEl.querySelector("[data-cal-today]");
    if (todayBtn) todayBtn.addEventListener("click", function () { cs.month = thisMonthStr(); cs.selectedDate = todayStr(); onChange(); });
  }

  function updateMyShiftsCalendar() {
    var el = document.getElementById("myShiftsCalendar");
    if (!el) return;
    var cs = calState.instructor;
    var mine = state.shifts.filter(function (s) { return s.instructorId === state.instructorId; });
    var byDate = groupShiftsByDate(mine);
    var calHtml = buildCalendarHtml(cs.month, byDate, cs.selectedDate, function (s) {
      return '<div class="cal-chip' + (s.type === "makeup" ? " makeup" : "") + '">' + esc(timeRange(s.startTime, s.endTime)) + "</div>";
    });
    var dayList = (byDate[cs.selectedDate] || []).slice().sort(function (a, b) { return String(a.startTime || "").localeCompare(String(b.startTime || "")); });
    var detailHtml = '<div class="cal-day-detail"><h3>' + esc(formatDateJp(cs.selectedDate)) + "</h3>" +
      (dayList.length ? dayList.map(function (s) {
        return '<div class="card" style="margin-bottom:8px;padding:12px 14px;">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">' +
            "<strong>" + esc(timeRange(s.startTime, s.endTime)) + "</strong>" +
            (s.type === "makeup" ? '<span class="pill makeup"><span class="dot"></span>振替授業</span>' : '<span class="pill normal"><span class="dot"></span>通常</span>') +
          "</div>" +
          '<div class="num" style="margin-top:6px;">' + esc(s.komaCount) + "コマ</div>" +
          (s.note ? '<div class="cell-note" style="margin-top:4px;">' + esc(s.note) + "</div>" : "") +
        "</div>";
      }).join("") : '<div class="empty-state">この日のシフトはありません</div>') +
    "</div>";
    el.innerHTML = calHtml + detailHtml;
    wireCalendarNav(el, "instructor", updateMyShiftsCalendar);

  /* Googleカレンダーとの同期用リンク。ICS配信はApps Script(doGet)側が
     行うので、ここでは講師ごとの合言葉(calendarToken)の発行・表示・
     再発行だけを扱う。CALENDAR_FEED_BASE_URL が未設定のうちはカードごと
     何も表示しない(Apps Script側のデプロイがまだのため)。 */
  function updateCalendarSyncCard() {
    var el = document.getElementById("calendarSyncCard");
    if (!el) return;
    if (!CALENDAR_FEED_BASE_URL) { el.innerHTML = ""; return; }
    var inst = byId(state.instructors, state.instructorId);
    if (!inst) { el.innerHTML = ""; return; }

    if (!inst.calendarToken) {
      el.innerHTML =
        '<h3 style="margin:0 0 8px;">📅 Googleカレンダーと同期</h3>' +
        '<p class="hint" style="margin:0 0 12px;">確定シフトを、ご自身のGoogleカレンダーに自動で取り込めるようにするリンクを発行します。</p>' +
        '<button type="button" class="btn btn-outline" id="calSyncGenBtn">同期用リンクを発行する</button>';
      var genBtn = document.getElementById("calSyncGenBtn");
      if (genBtn) {
        genBtn.addEventListener("click", function () {
          genBtn.disabled = true;
          state.db.collection("instructors").doc(inst.id).update({ calendarToken: generateCalendarToken_() })
            .catch(function (err) { toast(firebaseErrorMessage(err), true); genBtn.disabled = false; });
        });
      }
      return;
    }

    var url = CALENDAR_FEED_BASE_URL + "?id=" + encodeURIComponent(inst.id) + "&token=" + encodeURIComponent(inst.calendarToken);
    el.innerHTML =
      '<h3 style="margin:0 0 8px;">📅 Googleカレンダーと同期</h3>' +
      '<p class="hint" style="margin:0 0 10px;">下のリンクを、Googleカレンダーの「他のカレンダーを追加」→「URLで追加」に貼り付けてください。一度登録すれば、以降はシフトが確定・変更されるたびに自動で反映されます(反映までに数時間かかることがあります)。</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">' +
        '<input type="text" readonly value="' + esc(url) + '" id="calSyncUrlInput" style="flex:1;min-width:220px;" onclick="this.select()">' +
        '<button type="button" class="btn btn-outline btn-sm" id="calSyncCopyBtn">コピー</button>' +
      "</div>" +
      '<button type="button" class="linklike" id="calSyncRegenBtn">リンクを再発行する(古いリンクは使えなくなります)</button>';

    var copyBtn = document.getElementById("calSyncCopyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var input = document.getElementById("calSyncUrlInput");
        if (input) input.select();
        var done = function () { toast("リンクをコピーしました"); };
        var fallback = function () {
          try { document.execCommand("copy"); done(); }
          catch (e) { toast("コピーできませんでした。手動で選択してコピーしてください。", true); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done).catch(fallback);
        } else {
          fallback();
        }
      });
    }
    var regenBtn = document.getElementById("calSyncRegenBtn");
    if (regenBtn) {
      regenBtn.addEventListener("click", function () {
        onDangerClick(regenBtn, "もう一度押すと再発行します(今のリンクは使えなくなります)", function () {
          state.db.collection("instructors").doc(inst.id).update({ calendarToken: generateCalendarToken_() })
            .catch(function (err) { toast(firebaseErrorMessage(err), true); });
        });
      });
    }
  }
  function generateCalendarToken_() {
    var bytes = new Uint8Array(24);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    var out = "";
    for (var j = 0; j < bytes.length; j++) out += chars[bytes[j] % chars.length];
    return out;
  }

  /* ============ db / auth bootstrap ============
     Sign-in state comes from Firebase Authentication (it persists its own
     session; there is no localStorage bookkeeping to do here). Each
     signed-in user is resolved to either the admin role (their uid is
     listed in settings/roles.adminUids) or one instructor record (its
     authUid field matches their uid) — see resolveIdentity(). */
  var activeUnsubscribes = [];
  var subscribedForUid; /* undefined = never subscribed yet */

  function boot() {
    if (!window.__firestoreDb || !window.__firebaseAuth) {
      renderUnavailable();
      return;
    }
    state.db = window.__firestoreDb;
    state.auth = window.__firebaseAuth;
    state.downloads = true; /* CSV export uses a plain browser download here, always available */
    try {
      state.auth.onAuthStateChanged(function (user) {
        state.authUser = user || null;
        state.authReady = true;
        /* Firestoreの読み取りには「サインイン済みであること」が必要なルールに
           なっているため、ページを開いた直後(サインイン状態がまだ確定していない
           一瞬)に一度でも購読すると、その後サインインが確定しても同じ購読は
           「権限なし」のまま自動では直らないことがある(Firestoreの仕様)。
           そこで、サインイン中のユーザーが実際に変わった(未サインイン↔サインイン、
           別の人に切り替わった、など)タイミングごとに、購読を一度すべて解除して
           作り直す。これにより「ログインし直したのに一覧が空のまま」を防ぐ。 */
        var uid = user ? user.uid : null;
        if (uid !== subscribedForUid) {
          subscribedForUid = uid;
          activeUnsubscribes.forEach(function (unsub) { try { unsub(); } catch (e) {} });
          activeUnsubscribes = [];
          state.ready = { instructors: false, shiftCalls: false, availabilityResponses: false, shifts: false, workReports: false, notifications: false, roles: false };
          subscribeAll();
        }
        onDataChange();
      });
    } catch (e) {
      renderUnavailable();
    }
  }

  function renderUnavailable() {
    var root = document.getElementById("root");
    root.innerHTML =
      '<div class="gate">' +
      '<h1 class="display" style="font-size:1.2rem;margin:0;">データ機能を利用できませんでした</h1>' +

  /* ============ version / update banner ============
     Lets a viewer who already has the page open find out, live, that
     Claude has published a newer version — without silently reloading
     out from under them mid-input. The first page to load a newer
     APP_VERSION "announces" it into settings/appMeta; every other open
     tab is subscribed to that doc and shows a reload prompt when its
     own version is older. */
  function initVersionWatch() {
    var ref = state.db.doc("settings/appMeta");
    activeUnsubscribes.push(ref.onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      var stored = d && d.version;
      if (!stored) {
        ref.set({ version: APP_VERSION, updatedAt: Date.now() }).catch(function () {});
        return;
      }
      if (stored === APP_VERSION) return;
      if (String(stored) > APP_VERSION) {
        showVersionBanner();
      } else {
        ref.set({ version: APP_VERSION, updatedAt: Date.now() }).catch(function () {});
      }
    }, function () {}));
  }

  function showVersionBanner() {
    var el = document.getElementById("versionBanner");
    if (!el || el.classList.contains("show")) return;
    el.classList.add("show");
    el.innerHTML =
      '<div class="version-banner-inner">' +
        "<span>新しいバージョンが公開されました</span>" +
        '<button type="button" class="btn btn-primary btn-sm" id="versionReloadBtn">今すぐ更新する</button>' +
      "</div>";
    document.getElementById("versionReloadBtn").addEventListener("click", function () { location.reload(); });
  }

  var appStarted = false;
  var lastAuthUid = undefined; /* tracks which signed-in user we last resolved, so we only re-render the shell on an actual sign-in/sign-out transition */
  function allReady() {
    return state.ready.instructors && state.ready.shiftCalls && state.ready.availabilityResponses && state.ready.shifts && state.ready.workReports && state.ready.notifications && state.ready.instructorMessages && state.ready.students && state.ready.studentNotes && state.ready.makeupCalls && state.ready.roles && state.authReady;
  }

  /* Figures out state.role/instructorId/myName from the current Firebase
     Auth user plus the instructors/roles data. Does not render anything —
     callers decide whether the result changed enough to redraw. */
  function resolveIdentity() {
    if (!state.authUser) {
      state.role = null; state.instructorId = null; state.myName = null;
      lastAuthUid = null;
      return;
    }
    var uid = state.authUser.uid;
    if (isUidAdmin(uid)) {
      state.role = "admin"; state.instructorId = null; state.myName = state.authUser.displayName || "管理者";
      lastAuthUid = uid;
      return;
    }
    var inst = state.instructors.filter(function (i) { return i.authUid === uid; })[0];
    if (inst) {
      state.role = "instructor"; state.instructorId = inst.id; state.myName = inst.name;
      lastAuthUid = uid;
      return;
    }
    /* Signed in, but not (yet) linked to an admin or instructor record.
       This is expected for a moment right after self-registration, before
       our own write lands back through the snapshot listener — so don't
       sign the person out here, just don't show the app yet. */
    state.role = null; state.instructorId = null; state.myName = null;
  }

  function onDataChange() {
    if (!appStarted) {
      if (!allReady()) return;
      appStarted = true;
      resolveIdentity();
      if (state.role) { renderShell(); switchTab(state.role === "admin" ? ADMIN_TABS[0].id : INSTRUCTOR_TABS[0].id); }
      else { renderLogin(); }
      return;
    }
    var prevRole = state.role, prevInstructorId = state.instructorId;
    resolveIdentity();
    if (state.role !== prevRole || state.instructorId !== prevInstructorId) {
      if (state.role) { renderShell(); switchTab(state.role === "admin" ? ADMIN_TABS[0].id : INSTRUCTOR_TABS[0].id); }
      else { renderLogin(); }
      return;
    }
    if (!state.role) { renderLogin(); return; }
    refreshAll();
  }

  function logout() {
    if (state.auth) state.auth.signOut();
    state.role = null; state.instructorId = null; state.myName = null; state.activeTab = null;
    lastAuthUid = null;
    instructorAuth.error = "";
    adminAuth.error = "";
    renderLogin();
  }

  /* ============ login screen ============
     Real accounts via Firebase Authentication (email + password).

     Both sides now show a plain email+password form up front, with no
     "pick your name from a list" step. Reason: Firestore's security rules
     require signedIn() to read instructors/ or settings/roles, so before
     anyone has logged in we simply cannot know who is already registered
     — a list built from that data would always come back empty for a
     brand-new visitor. Instead we always try beginAccount() (create the
     Firebase Auth account; if the email is already in use, sign in with
     the entered password instead — see its comment above), then, now
     that we ARE signed in and Firestore reads are allowed, look up the
     matching instructor/admin record and link it if this is the first
     time. If the email doesn't match any registered instructor/admin,
     we undo the sign-in (deleting the Auth account too, if we just
     created it) and show an error instead of leaving a stray account. */
  var instructorAuth = { error: "" };
  var adminAuth = { error: "" };

  function renderLogin() {
    var leftColHtml =
      '<form id="instructorAuthForm">' +
        '<p class="hint" style="margin:0 0 12px;">初めてご利用の方は、管理者に登録してもらったメールアドレスで、お好きなパスワードを決めて送信してください。2回目以降は同じメールアドレスとパスワードでログインできます。</p>' +
        '<div class="field"><label for="instEmailInput">メールアドレス</label><input type="email" id="instEmailInput" autocomplete="email" required></div>' +
        '<div class="field"><label for="instPinInput">パスワード(6文字以上)</label><input type="password" id="instPinInput" autocomplete="current-password" required minlength="6"></div>' +
        (instructorAuth.error ? '<p style="color:var(--rose);font-size:.8rem;margin:-6px 0 12px;">' + esc(instructorAuth.error) + "</p>" : "") +
        '<button type="submit" class="btn btn-primary btn-block">ログイン / はじめて登録する</button>' +
        '<button type="button" class="linklike" id="instForgotBtn">パスワードを忘れた方はこちら</button>' +
      "</form>";

    var rightColHtml =
      '<form class="admin-login-form" id="adminAuthForm">' +
        '<p class="hint" style="margin:0 0 12px;">最初にログインする方は、お名前とメールアドレス、お好きなパスワードを決めて送信してください。2回目以降は同じメールアドレスとパスワードでログインできます。</p>' +
        '<div class="field"><label for="adminNameInput">お名前(表示用・初回のみ)</label><input type="text" id="adminNameInput" placeholder="例: 教室長" maxlength="30"></div>' +
        '<div class="field"><label for="adminEmailInput">メールアドレス</label><input type="email" id="adminEmailInput" autocomplete="email" required></div>' +
        '<div class="field"><label for="adminPinInput">パスワード(6文字以上)</label><input type="password" id="adminPinInput" autocomplete="current-password" required minlength="6"></div>' +
        (adminAuth.error ? '<p style="color:var(--rose);font-size:.8rem;margin:-6px 0 12px;">' + esc(adminAuth.error) + "</p>" : "") +
        '<button type="submit" class="btn btn-primary btn-block">ログイン / はじめて登録する</button>' +
        '<button type="button" class="linklike" id="adminForgotBtn">パスワードを忘れた方はこちら</button>' +
      "</form>";

    document.getElementById("root").innerHTML =
      '<div class="login-wrap"><div class="login-card">' +
        '<div class="login-head">' +
          '<div class="beads-row"><span></span><span></span><span></span><span></span><span></span></div>' +
          "<h1>そろばんシフト帳</h1>" +
          "<p>希望シフトの提出から出勤実績・給与の集計まで、講師と管理者でひとつにまとめます。</p>" +
        "</div>" +
        '<div class="login-body">' +
          '<div class="login-col">' +
            "<h2>講師の方はこちら</h2>" + leftColHtml +
          "</div>" +
          '<div class="login-col">' +
            "<h2>管理者の方はこちら</h2>" + rightColHtml +
          "</div>" +
        "</div>" +
      "</div></div>";

    var instructorAuthForm = document.getElementById("instructorAuthForm");
    if (instructorAuthForm) {
      instructorAuthForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("instEmailInput").value.trim();
        var pin = document.getElementById("instPinInput").value;
        instructorAuth.error = "";
        var createdNew = false;
        var uid = null;
        beginAccount(email, pin)
          .then(function (result) {
            createdNew = result.created;
            uid = result.cred.user.uid;
            return state.db.collection("instructors").where("email", "==", email).get();
          })
          .then(function (snap) {
            if (snap.empty) {
              var notFoundErr = new Error("not-instructor");
              notFoundErr.notInstructor = true;
              throw notFoundErr;
            }
            var doc = snap.docs[0];
            var data = doc.data();
            if (data.authUid && data.authUid !== uid) {
              var mismatchErr = new Error("mismatch");
              mismatchErr.mismatch = true;
              throw mismatchErr;
            }
            var finish = function () {
              instructorAuth.error = "";
              lastAuthUid = uid;
              state.role = "instructor"; state.instructorId = doc.id; state.myName = data.name;
              renderShell();
              switchTab(INSTRUCTOR_TABS[0].id);
            };
            if (!data.authUid) return doc.ref.update({ authUid: uid }).then(finish);
            finish();
          })
          .catch(function (err) {
            if (err && err.notInstructor) {
              instructorAuth.error = "このメールアドレスは講師として登録されていません。管理者にご確認ください。";
              if (createdNew && state.auth.currentUser) state.auth.currentUser.delete().catch(function () {});
              else state.auth.signOut();
            } else if (err && err.mismatch) {
              instructorAuth.error = "このアカウントはすでに別の講師として登録されているようです。管理者にご連絡ください。";
              state.auth.signOut();
            } else if (err && err.alreadyInUse) {
              instructorAuth.error = "このメールアドレスはすでに登録されていますが、入力されたパスワードでは確認できませんでした。「パスワードを忘れた方はこちら」からお試しください。";
            } else {
              instructorAuth.error = firebaseErrorMessage(err);
            }
            renderLogin();
          });
      });
    }
    var instForgotBtn = document.getElementById("instForgotBtn");
    if (instForgotBtn) {
      instForgotBtn.addEventListener("click", function () {
        var email = document.getElementById("instEmailInput").value.trim();
        if (!email) { instructorAuth.error = "メールアドレスを入力してから押してください。"; renderLogin(); return; }
        state.auth.sendPasswordResetEmail(email).then(function () {
          toast(email + " 宛にパスワード再設定メールを送信しました");
        }).catch(function (err) { toast(firebaseErrorMessage(err), true); });
      });
    }

    var adminAuthForm = document.getElementById("adminAuthForm");
    if (adminAuthForm) {
      adminAuthForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("adminNameInput").value.trim() || "管理者";
        var email = document.getElementById("adminEmailInput").value.trim();
        var pin = document.getElementById("adminPinInput").value;
        adminAuth.error = "";
        var createdNew = false;
        var uid = null;
        beginAccount(email, pin)
          .then(function (result) {
            createdNew = result.created;
            uid = result.cred.user.uid;
            if (result.created) return result.cred.user.updateProfile({ displayName: name });
          })
          .then(function () {
            return state.db.doc("settings/roles").get();
          })
          .then(function (snap) {
            var data = snap.exists ? snap.data() : null;
            var adminUids = (data && Array.isArray(data.adminUids)) ? data.adminUids : [];
            var finish = function () {
              adminAuth.error = "";
              lastAuthUid = uid;
              state.role = "admin"; state.instructorId = null; state.myName = name;
              renderShell();
              switchTab(ADMIN_TABS[0].id);
            };
            if (adminUids.indexOf(uid) !== -1) { finish(); return; }
            if (!snap.exists) {
              return state.db.doc("settings/roles").set({ adminUids: [uid], updatedAt: Date.now() }).then(finish);
            }
            var notAdminErr = new Error("not-admin");
            notAdminErr.notAdmin = true;
            throw notAdminErr;
          })
          .catch(function (err) {
            if (err && err.notAdmin) {
              adminAuth.error = "このメールアドレスは管理者として登録されていません。既存の管理者にご確認ください。";
              if (createdNew && state.auth.currentUser) state.auth.currentUser.delete().catch(function () {});
              else state.auth.signOut();
            } else if (err && err.alreadyInUse) {
              adminAuth.error = "このメールアドレスはすでに登録されていますが、入力されたパスワードでは確認できませんでした。「パスワードを忘れた方はこちら」からお試しください。";
            } else {
              adminAuth.error = firebaseErrorMessage(err);
            }
            renderLogin();
          });
      });
    }
    var adminForgotBtn = document.getElementById("adminForgotBtn");
    if (adminForgotBtn) {
      adminForgotBtn.addEventListener("click", function () {
        var email = document.getElementById("adminEmailInput").value.trim();
        if (!email) { adminAuth.error = "メールアドレスを入力してから押してください。"; renderLogin(); return; }
        state.auth.sendPasswordResetEmail(email).then(function () {
          toast(email + " 宛にパスワード再設定メールを送信しました");
        }).catch(function (err) { toast(firebaseErrorMessage(err), true); });
      });
    }
  }

              '<div class="field"><label for="wrNote">備考(任意)</label><textarea id="wrNote" placeholder="例: 振替1コマ含む"></textarea></div>' +
              '<button type="submit" class="btn btn-primary btn-block">実績を提出する</button>' +
            "</form>" +
          "</div>" +
          '<div class="card">' +
            "<h2>提出履歴</h2><p class=\"card-sub\">承認状況を確認できます</p>" +
            '<div id="list-myReports"></div>' +
          "</div>" +
        "</div>";
      document.getElementById("workReportForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var koma = Number(document.getElementById("wrKoma").value);
        var date = document.getElementById("wrDate").value;
        if (!date || !koma || koma < 1) { toast("勤務日とコマ数を入力してください", true); return; }
        if (date > todayStr()) { toast("未来の日付は選択できません", true); return; }
        var body = {
          instructorId: state.instructorId,
          instructorName: state.myName,
          date: date,
          shiftId: document.getElementById("wrShift").value || null,
          komaCount: koma,
          note: document.getElementById("wrNote").value.trim(),
          status: "pending",
          adminNote: "",
          submittedAt: Date.now()
        };
        state.db.collection("workReports").add(body).then(function () {
          toast("実績を提出しました。承認をお待ちください。");
          e.target.reset();
          document.getElementById("wrDate").value = todayStr();
        }).catch(function () { toast("送信に失敗しました。もう一度お試しください。", true); });
      });

    if (tabId === "summary") {
      main.innerHTML =
        '<div class="page-head"><h1>実績・給与目安</h1><p>承認済みの実績コマ数から給与の目安を計算します(あくまで目安です)。</p></div>' +
        '<div id="unreadBanner"></div>' +
        '<div id="summaryContent"></div>';
    }

    if (tabId === "students") {
      renderStudentsTab(main);
    }

    if (tabId === "notices") {
      main.innerHTML =
        '<div class="page-head"><h1>お知らせ</h1><p>管理者からのお知らせです。また、ここから管理者へ連絡することもできます。</p></div>' +
        '<div class="two-col">' +
          '<div class="card"><div id="list-notices"></div></div>' +
          '<div class="card">' +
            "<h2>管理者へ連絡する</h2><p class=\"card-sub\">シフトのこと以外でも、伝えたいことがあればここから送れます。</p>" +
            '<form id="instructorMsgForm">' +
              '<div class="field"><label for="imBody">内容</label><textarea id="imBody" required placeholder="例: 来月は都合により出勤日を減らしたいです"></textarea></div>' +
              '<button type="submit" class="btn btn-primary btn-block">送信する</button>' +
            "</form>" +
            '<div id="list-myInstructorMessages" style="margin-top:14px;"></div>' +
          "</div>" +
        "</div>";
      document.getElementById("instructorMsgForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var body = document.getElementById("imBody").value.trim();
        if (!body) { toast("内容を入力してください", true); return; }
        state.db.collection("instructorMessages").add({
          instructorId: state.instructorId,
          instructorName: state.myName,
          body: body,
          createdAt: Date.now(),
          read: false,
          emailSent: false /* メール配信用のGoogle Apps Scriptがこの項目を見て、まだメール
                               送信していない連絡を見つけ、送信後にtrueへ更新する。 */
        }).then(function () {
          toast("管理者に送信しました");
          e.target.reset();
        }).catch(function () { toast("送信に失敗しました。もう一度お試しください。", true); });
      });
    }
  }

  function populateMyShiftSelect() {
    var sel = document.getElementById("wrShift");
    if (!sel) return;
    var mine = state.shifts.filter(function (s) { return s.instructorId === state.instructorId; }).sort(sortByDateDesc).slice(0, 40);
    var cur = sel.value;
    sel.innerHTML = '<option value="">選択しない</option>' + mine.map(function (s) {
      return '<option value="' + esc(s.id) + '">' + esc(formatDateShort(s.date)) + " " + esc(timeRange(s.startTime, s.endTime)) + " ・" + esc(s.komaCount) + "コマ" + (s.type === "makeup" ? "(振替)" : "") + "</option>";
    }).join("");
    if (cur && mine.some(function (s) { return s.id === cur; })) sel.value = cur;
  }

  /* 振替授業の「早い者勝ち募集」カード。まだ誰も担当していない(status
     が "open")募集だけを表示する。担当が決まった募集は、全員の画面から
     自動的に消える(status が "claimed" に変わり、この一覧の対象外になる
     ため)。 */
  function updateMakeupCallsCard() {
    var el = document.getElementById("makeupCallsCard");
    if (!el) return;
    var open = state.makeupCalls.filter(function (c) { return c.status === "open"; }).sort(sortByDateAsc);
    if (open.length === 0) { el.innerHTML = ""; return; }
    el.innerHTML =
      "<h2>振替授業の募集</h2>" +
      '<p class="card-sub">「担当する」を押した講師が担当になります。すでに担当が決まった募集はここから消えます。</p>' +
      open.map(function (c) {
        var studentLine = c.studentIds && c.studentIds.length ? "<div class=\"notice-meta\" style=\"margin-bottom:0;\">対象の生徒: " + esc(studentNames(c.studentIds)) + "</div>" : "";
        return '<div class="notice-card">' +
          "<div><strong>" + esc(formatDateJp(c.date)) + '</strong><strong style="margin-left:8px;">' + esc(timeRange(c.startTime, c.endTime)) + "</strong><span class=\"cell-note\" style=\"margin-left:8px;\">" + esc(c.komaCount) + "コマ</span></div>" +
          studentLine +
          (c.note ? '<div class="notice-body" style="margin-top:6px;">' + esc(c.note) + "</div>" : "") +
          '<div class="row-actions" style="margin-top:10px;"><button type="button" class="btn btn-primary btn-sm" data-claim-call="' + esc(c.id) + '">担当する</button></div>' +
        "</div>";
      }).join("");
    el.querySelectorAll("[data-claim-call]").forEach(function (b) {
      b.addEventListener("click", function () {
        onDangerClick(b, "もう一度押すと担当が確定します", function () {
          claimMakeupCall(b.getAttribute("data-claim-call"));
        });
      });
    });
  }

  function updateAvailList() {
    var el = document.getElementById("list-availCalls");
    if (!el) return;
    var calls = state.shiftCalls.slice().sort(sortByDateAsc);
    if (calls.length === 0) { el.innerHTML = '<div class="empty-state">まだ管理者からのシフト募集はありません</div>'; return; }
    var respByCall = {};
    state.availabilityResponses.forEach(function (r) {
      if (r.instructorId === state.instructorId) respByCall[r.callId] = r;
    });
    el.innerHTML = calls.map(function (c) {
      var resp = respByCall[c.id];
      var ans = resp ? resp.answer : null;
      var isPastDeadline = !!(c.deadline && c.deadline < todayStr());
      var deadlineNote = "";
      if (c.deadline) {
        var isOverdue = isPastDeadline && !ans;
        deadlineNote = '<div class="cell-note" style="margin-bottom:8px;' + (isOverdue ? "color:var(--vermillion);" : "") + '">回答締切: ' + esc(formatDateJp(c.deadline)) + (isOverdue ? "(締切を過ぎています。お早めにご回答ください)" : "") + "</div>";
      }
      var lockedNote = isPastDeadline
        ? '<div class="cell-note" style="margin-top:8px;color:var(--vermillion);">回答締切を過ぎているため、これ以上の変更はできません。変更が必要な場合は管理者にご連絡ください。</div>'
        : "";
      var dis = isPastDeadline ? " disabled" : "";
      return '<div class="card" style="margin-bottom:12px;">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">' +
          "<div><strong>" + esc(formatDateJp(c.date)) + '</strong><strong style="margin-left:8px;">' + esc(timeRange(c.startTime, c.endTime)) + "</strong></div>" +
          (ans === "available" ? '<span class="pill approved"><span class="dot"></span>出勤可能で回答済み</span>' :
            ans === "unavailable" ? '<span class="pill off"><span class="dot"></span>休み希望で回答済み</span>' :
            '<span class="pill pending"><span class="dot"></span>未回答</span>') +
        "</div>" +
        deadlineNote +
        (c.note ? '<div class="cell-note" style="margin-bottom:10px;">' + esc(c.note) + "</div>" : "") +
        '<div class="radio-group" data-answer-group="' + esc(c.id) + '">' +
          '<label class="radio-chip' + (ans === "available" ? " checked" : "") + '"><input type="radio" name="ans-' + esc(c.id) + '" value="available"' + (ans === "available" ? " checked" : "") + dis + ">出勤可能</label>" +
          '<label class="radio-chip' + (ans === "unavailable" ? " checked" : "") + '"><input type="radio" name="ans-' + esc(c.id) + '" value="unavailable"' + (ans === "unavailable" ? " checked" : "") + dis + ">休み希望</label>" +
        "</div>" +
        '<textarea class="answer-note" data-note-for="' + esc(c.id) + '" placeholder="備考(任意)" style="margin-top:8px;"' + dis + ">" + esc(resp && resp.note ? resp.note : "") + "</textarea>" +
        (isPastDeadline ? "" : '<button type="button" class="btn btn-primary btn-sm" style="margin-top:8px;" data-save-answer="' + esc(c.id) + '">回答を保存する</button>') +
        lockedNote +
      "</div>";
    }).join("");

    el.querySelectorAll("[data-answer-group]").forEach(function (group) {
      group.addEventListener("change", function () {
        group.querySelectorAll(".radio-chip").forEach(function (c) { c.classList.toggle("checked", c.querySelector("input").checked); });
      });
    });
    el.querySelectorAll("[data-save-answer]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var callId = btn.getAttribute("data-save-answer");
        var call = byId(state.shiftCalls, callId);
        if (call && call.deadline && call.deadline < todayStr()) { toast("回答締切を過ぎているため変更できません", true); return; }
        var group = el.querySelector('[data-answer-group="' + callId + '"]');
        var checked = group ? group.querySelector("input:checked") : null;
        if (!checked) { toast("出勤可能か休み希望を選んでください", true); return; }
        var noteEl = el.querySelector('[data-note-for="' + callId + '"]');
        var docId = callId + "__" + state.instructorId;
        state.db.collection("availabilityResponses").doc(docId).set({
          callId: callId,
          instructorId: state.instructorId,
          instructorName: state.myName,
          date: call ? call.date : "",
          answer: checked.value,
          note: noteEl ? noteEl.value.trim() : "",
          respondedAt: Date.now()
        }).then(function () { toast("回答を保存しました"); }).catch(function () { toast("保存に失敗しました。もう一度お試しください。", true); });
      });
    });
  }

  function markMyNoticesRead() {
    if (state.role !== "instructor") return;
    var unread = state.notifications.filter(function (n) {
      var forMe = !n.targetInstructorId || n.targetInstructorId === state.instructorId;
      var read = Array.isArray(n.readBy) && n.readBy.indexOf(state.instructorId) !== -1;
      return forMe && !read;
    });
    unread.forEach(function (n) {
      var readBy = Array.isArray(n.readBy) ? n.readBy.slice() : [];
      readBy.push(state.instructorId);
      state.db.collection("notifications").doc(n.id).update({ readBy: readBy }).catch(function () {});
    });
  }

  function updateNoticesList() {
    var el = document.getElementById("list-notices");
    if (!el) return;
    markMyNoticesRead();
    var mine = state.notifications.filter(function (n) { return !n.targetInstructorId || n.targetInstructorId === state.instructorId; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (mine.length === 0) { el.innerHTML = '<div class="empty-state">お知らせはまだありません</div>'; return; }
    el.innerHTML = mine.map(function (n) {
      var read = Array.isArray(n.readBy) && n.readBy.indexOf(state.instructorId) !== -1;
      var when = n.createdAt ? new Date(n.createdAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      return '<div class="notice-card' + (read ? "" : " unread") + '">' +
        '<div class="notice-title">' + esc(n.title) + "</div>" +
        '<div class="notice-meta">' + esc(when) + "</div>" +
        '<div class="notice-body">' + esc(n.body) + "</div>" +
      "</div>";
    }).join("");
  }

  function updateMyInstructorMessagesList() {
    var el = document.getElementById("list-myInstructorMessages");

    var mine = state.instructorMessages.filter(function (m) { return m.instructorId === state.instructorId; })

      return '<div class="notice-card">' +
        '<div class="notice-meta">' + esc(when) + " ・ " + (m.read ? "管理者が既読" : "未読") + "</div>" +
        '<div class="notice-body">' + esc(m.body) + "</div>" +
      "</div>";

    var el = document.getElementById("unreadBanner");

    var n = state.role === "admin" ? unreadInstructorMessageCount() : myUnreadNoticeCount();

    if (el) { if (n > 0) { el.textContent = n; el.hidden = false; } else { el.hidden = true; } }

  function updateMyShiftsList() {
    var el = document.getElementById("list-myShifts");
    if (!el) return;
    var mine = state.shifts.filter(function (s) { return s.instructorId === state.instructorId; }).sort(sortByDateAsc);
    var today = todayStr();
    var upcoming = mine.filter(function (s) { return s.date >= today; });
    var past = mine.filter(function (s) { return s.date < today; }).sort(sortByDateDesc);
    function rows(list) {
      return list.map(function (s) {
        var studentLine = s.studentIds && s.studentIds.length ? "対象: " + studentNames(s.studentIds) + (s.note ? " / " : "") : "";
        return "<tr><td>" + esc(formatDateJp(s.date)) + "</td><td>" + esc(timeRange(s.startTime, s.endTime)) + "</td><td class=\"num\">" + esc(s.komaCount) + "コマ</td><td>" +
          (s.type === "makeup" ? '<span class="pill makeup"><span class="dot"></span>振替授業</span>' : '<span class="pill normal"><span class="dot"></span>通常</span>') +
          "</td><td class=\"cell-note\">" + esc(studentLine) + esc(s.note || (studentLine ? "" : "—")) + "</td></tr>";
      }).join("");
    }
    var html = "";
    html += "<h2 style=\"font-size:.95rem;margin:0 0 10px;\">今後のシフト(" + upcoming.length + "件)</h2>";
    html += upcoming.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>日付</th><th>時間</th><th>コマ数</th><th>種別</th><th>備考</th></tr></thead><tbody>' + rows(upcoming) + "</tbody></table></div>" : '<div class="empty-state">今後確定しているシフトはありません</div>';
    html += '<div class="divider"></div>';
    html += "<h2 style=\"font-size:.95rem;margin:0 0 10px;\">過去のシフト</h2>";
    html += past.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>日付</th><th>時間</th><th>コマ数</th><th>種別</th><th>備考</th></tr></thead><tbody>' + rows(past.slice(0, 30)) + "</tbody></table></div>" : '<div class="empty-state">過去のシフト履歴はありません</div>';
    el.innerHTML = html;
    populateMyShiftSelect();
  }

  function updateMyReportsList() {
    var el = document.getElementById("list-myReports");
    if (!el) return;
    var mine = state.workReports.filter(function (r) { return r.instructorId === state.instructorId; }).sort(sortByDateDesc);
    if (mine.length === 0) { el.innerHTML = '<div class="empty-state">まだ提出した実績はありません</div>'; return; }

      }).join("") + "</tbody></table></div>";

  function updateSummary() {
    var el = document.getElementById("summaryContent");
    if (!el) return;
    var mine = state.workReports.filter(function (r) { return r.instructorId === state.instructorId && r.status === "approved"; });
    var rate = instructorRate(state.instructorId);
    var month = thisMonthStr();
    var thisMonth = mine.filter(function (r) { return r.date.slice(0, 7) === month; });
    var komaMonth = thisMonth.reduce(function (a, r) { return a + Number(r.komaCount || 0); }, 0);
    var komaAll = mine.reduce(function (a, r) { return a + Number(r.komaCount || 0); }, 0);
    var pendingCount = state.workReports.filter(function (r) { return r.instructorId === state.instructorId && r.status === "pending"; }).length;
    el.innerHTML =
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="label">今月の承認済みコマ数</div><div class="value num">' + komaMonth + '<span class="unit">コマ</span></div></div>' +
        '<div class="stat-card"><div class="label">今月の給与目安</div><div class="value num">' + yen(komaMonth * rate) + "</div></div>" +
        '<div class="stat-card"><div class="label">累計の承認済みコマ数</div><div class="value num">' + komaAll + '<span class="unit">コマ</span></div></div>' +
        '<div class="stat-card"><div class="label">承認待ちの提出</div><div class="value num">' + pendingCount + '<span class="unit">件</span></div></div>' +
      "</div>" +
      '<p class="hint">単価: ' + yen(rate) + " / コマ(管理者が設定)。給与目安は承認済みの実績のみで計算しています。</p>";
  }

    var el = document.getElementById("list-students");
    if (!el) return;
    // 誰かが一覧の中の入力欄(目標・級・共有メモなど)に書き込んでいる最中に
    // 他の講師の更新が届いて一覧が描き直されると、書きかけの内容が消えてしまう。
    // そのため入力中は描き直しを保留し、入力欄から離れた時点でまとめて描き直す。
    var active = document.activeElement;
    if (active && el.contains(active) && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) {
      el._pendingRefresh = true;
      if (!active._refreshHooked) {
        active._refreshHooked = true;
        active.addEventListener("blur", function () {
          setTimeout(function () {
            if (el._pendingRefresh) { el._pendingRefresh = false; updateStudentsList(); }
          }, 0);
        }, { once: true });
      }
      return;
    }
    el._pendingRefresh = false;
    var searchInput = document.getElementById("stSearch");
    var query = searchInput ? searchInput.value.trim().toLowerCase() : "";
    var all = state.students.filter(function (s) { return s.active !== false; });
    var list = all.filter(function (s) {
      if (!query) return true;
      var name = String(s.name || "").toLowerCase();
      var furigana = String(s.furigana || "").toLowerCase();
      return name.indexOf(query) !== -1 || furigana.indexOf(query) !== -1;
    }).sort(function (a, b) {
      return String(a.furigana || a.name).localeCompare(String(b.furigana || b.name), "ja");
    });

    if (all.length === 0) { el.innerHTML = '<div class="empty-state">まだ生徒が登録されていません</div>'; return; }
    if (list.length === 0) { el.innerHTML = '<div class="empty-state">「' + esc(searchInput.value.trim()) + '」に一致する生徒が見つかりません</div>'; return; }

    el.innerHTML = list.map(function (s) {
      var expanded = state.expandedStudentId === s.id;
      var notes = state.studentNotes.filter(function (n) { return n.studentId === s.id; })
        .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      var detailHtml = "";
      if (expanded) {
        var summaryHtml = s.summary
          ? '<div class="ai-summary-box">' +
              '<div class="ai-summary-label">AIによる要約(直近の記録から自動作成)</div>' +
              "<div>" + esc(s.summary) + "</div>" +
              '<div class="ai-summary-meta">' + (s.summaryUpdatedAt ? "最終更新: " + esc(new Date(s.summaryUpdatedAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })) : "") + "</div>" +
            "</div>"
          : '<p class="hint">まだ要約はありません。記録がたまると自動で作成されます(数分〜数十分ほどかかることがあります)。</p>';

        var notesHtml = notes.length === 0
          ? '<div class="empty-state">まだ記録はありません</div>'
          : notes.map(function (n) {
              var when = n.createdAt ? new Date(n.createdAt).toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
              return '<div class="notice-card">' +
                '<div class="notice-body">' + esc(n.body) + "</div>" +
                '<div class="notice-meta" style="margin-top:6px;margin-bottom:0;">' + esc(when) + " ・ " + esc(n.authorName || "") + "</div>" +
              "</div>";
            }).join("");

        detailHtml =
          '<div class="student-detail">' +
            summaryHtml +
            '<form data-note-form="' + esc(s.id) + '" style="margin-bottom:14px;">' +
              '<div class="field"><label for="noteBody-' + esc(s.id) + '">情報を共有する</label><textarea id="noteBody-' + esc(s.id) + '" required placeholder="例: 今日は繰り上がりの練習を頑張っていました"></textarea></div>' +
              '<button type="submit" class="btn btn-primary btn-sm">送信する</button>' +
            "</form>" +
            "<h2>これまでの記録</h2>" +
            notesHtml +
          "</div>";
      }
      return '<div class="student-row">' +
        '<div class="student-row-head">' +
          '<div class="name">' + esc(s.name) + "</div>" +
          '<div style="display:flex;gap:8px;align-items:center;">' +
            '<button type="button" class="btn btn-outline btn-sm" data-toggle-student="' + esc(s.id) + '">' + (expanded ? "閉じる" : "詳しく見る") + "</button>" +
            (state.role === "admin" ? '<button type="button" class="btn btn-danger btn-sm" data-del-student="' + esc(s.id) + '">削除</button>' : "") +
          "</div>" +
        "</div>" +
        '<div class="student-levels">' +
          '<div class="field"><label>ふりがな</label><input type="text" maxlength="40" style="width:160px;" value="' + esc(s.furigana || "") + '" data-furigana-id="' + esc(s.id) + '" placeholder="未設定"></div>' +
          '<div class="field"><label>珠算</label><input type="text" maxlength="20" style="width:100px;" value="' + esc(s.sorobanLevel || "") + '" data-soroban-id="' + esc(s.id) + '" placeholder="未設定"></div>' +
          '<div class="field"><label>暗算</label><input type="text" maxlength="20" style="width:100px;" value="' + esc(s.anzanLevel || "") + '" data-anzan-id="' + esc(s.id) + '" placeholder="未設定"></div>' +
          '<div class="field goal-field"><label>目標・指導のポイント</label><textarea rows="2" maxlength="300" data-goal-id="' + esc(s.id) + '" placeholder="未設定(例: 12月の検定で3級合格。見取り算のスピードを重点的に)">' + esc(s.goal || "") + "</textarea></div>" +
        "</div>" +
        detailHtml +
      "</div>";
    }).join("");

    el.querySelectorAll("[data-toggle-student]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-toggle-student");
        state.expandedStudentId = (state.expandedStudentId === id) ? null : id;
        updateStudentsList();

    el.querySelectorAll("[data-furigana-id]").forEach(function (inp) {

      });

    el.querySelectorAll("[data-anzan-id]").forEach(function (inp) {

    el.querySelectorAll("[data-note-form]").forEach(function (form) {
      form.addEventListener("submit", function (e) {

        }).then(function () {
          ta.value = "";

          toast("共有しました");
        }).catch(function () { toast("送信に失敗しました。もう一度お試しください。", true); });
      });
    });

     仕組み(お知らせ配信と共通)がそのままメール送信も行ってくれる。 */
  function notifyShiftConfirmed(shiftBody, isEdit) {
    if (!shiftBody || !shiftBody.instructorId) return;
    var title;
    if (shiftBody.type === "makeup") title = "振替授業が追加されました";
    else title = isEdit ? "シフト内容が更新されました" : "シフトが確定しました";
    var studentLine = shiftBody.studentIds && shiftBody.studentIds.length ? "\n対象の生徒: " + studentNames(shiftBody.studentIds) : "";
    var body = formatDateJp(shiftBody.date) + " " + timeRange(shiftBody.startTime, shiftBody.endTime) +
      "(" + shiftBody.komaCount + "コマ)" + studentLine + (shiftBody.note ? "\n備考: " + shiftBody.note : "");
    state.db.collection("notifications").add({
      title: title,
      body: body,
      targetInstructorId: shiftBody.instructorId,
      createdAt: Date.now(),
      createdBy: state.myName,
      readBy: [],
      emailSent: false
    }).catch(function () {});
  }

  /* 振替授業の「早い者勝ち募集」に応募する。Firestoreのトランザクションで
     「まだstatusがopenのときだけ」claimedに書き換え、同時に確定シフトを
     作成する。すでに他の講師が先に担当していた場合(status !== "open")は
     トランザクションが失敗し、エラーメッセージを出す。ほぼ同時に複数の
     講師が押した場合も、Firestore側が自動で片方だけを成功させる。 */
  function claimMakeupCall(callId) {
    var callRef = state.db.collection("makeupCalls").doc(callId);
    var shiftRef = state.db.collection("shifts").doc();
    state.db.runTransaction(function (transaction) {
      return transaction.get(callRef).then(function (snap) {
        if (!snap.exists) { throw new Error("call-not-found"); }
        var call = snap.data();
        if (call.status !== "open") { throw new Error("already-claimed"); }
        var shiftBody = {
          instructorId: state.instructorId,
          instructorName: state.myName,
          date: call.date,
          startTime: call.startTime,
          endTime: call.endTime,
          komaCount: call.komaCount,
          type: "makeup",
          studentIds: call.studentIds || [],
          note: call.note || "",
          makeupCallId: callId,
          createdAt: Date.now(),
          createdBy: state.myName
        };
        transaction.update(callRef, {
          status: "claimed",
          claimedByInstructorId: state.instructorId,
          claimedByInstructorName: state.myName,
          claimedAt: Date.now(),
          shiftId: shiftRef.id
        });
        transaction.set(shiftRef, shiftBody);
        return shiftBody;
      });
    }).then(function (shiftBody) {
      toast("担当が確定しました");
      notifyShiftConfirmed(shiftBody, false);
    }).catch(function (err) {
      if (err && err.message === "already-claimed") {
        toast("すでに他の講師が担当しています", true);
      } else if (err && err.message === "call-not-found") {
        toast("この募集はすでに削除されています", true);
      } else {
        toast("担当の確定に失敗しました。もう一度お試しください。", true);
      }
    });
  }

  function updateAdminCallsList() {
    var el = document.getElementById("list-adminCalls");
    if (!el) return;
    var calls = state.shiftCalls.slice().sort(sortByDateAsc);
    if (calls.length === 0) { el.innerHTML = '<div class="empty-state">まだシフト募集がありません</div>'; return; }
    var activeInstructors = state.instructors.filter(function (i) { return i.active !== false; })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "ja"); });
    function compactGroupHtml(list, byInstId, pillClass, pillLabel) {
      if (list.length === 0) return "";
      var names = list.map(function (inst) {
        var r = byInstId[inst.id];
        return esc(inst.name) + (r && r.note ? "(" + esc(r.note) + ")" : "");
      }).join("、");
      return '<div class="cell-note" style="padding:6px 0;border-top:1px solid var(--line-soft);">' +
        '<span class="pill ' + pillClass + '" style="margin-right:6px;"><span class="dot"></span>' + pillLabel + "(" + list.length + "人)</span>" + names + "</div>";
    }
    el.innerHTML = calls.map(function (c) {
      var responses = state.availabilityResponses.filter(function (r) { return r.callId === c.id; });
      var byInstId = {};
      responses.forEach(function (r) { byInstId[r.instructorId] = r; });
      var availableCount = responses.filter(function (r) { return r.answer === "available"; }).length;
      var unavailableCount = responses.filter(function (r) { return r.answer === "unavailable"; }).length;
      var noResponseCount = Math.max(activeInstructors.length - responses.length, 0);
      /* 講師の人数が増えても見づらくならないよう、状態ごとにまとめる。
         「シフトを作成」の操作が必要な出勤可能な講師だけを1人1行で目立たせ、
         休み希望・未回答は名前を並べるだけのコンパクトな1〜数行にする。 */
      var availableList = [], unavailableList = [], noResponseList = [];
      activeInstructors.forEach(function (inst) {
        var r = byInstId[inst.id];
        if (!r) noResponseList.push(inst);
        else if (r.answer === "available") availableList.push(inst);
        else unavailableList.push(inst);
      });
      var availableRows = availableList.map(function (inst) {
        var r = byInstId[inst.id];
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;">' +
          "<span>" + esc(inst.name) + (r.note ? '<span class="cell-note" style="margin-left:6px;">' + esc(r.note) + "</span>" : "") + "</span>" +
          '<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span class="pill approved"><span class="dot"></span>出勤可能</span>' +
            '<button type="button" class="btn btn-outline btn-sm" data-go-shift="' + esc(c.id) + '" data-go-inst="' + esc(inst.id) + '">シフトを作成</button></span>' +
        "</div>";
      }).join("");
      var rows = availableRows + compactGroupHtml(unavailableList, byInstId, "off", "休み希望") + compactGroupHtml(noResponseList, byInstId, "pending", "未回答");
      var deadlineHtml = "";
      if (c.deadline) {
        var isOverdue = c.deadline < todayStr() && noResponseCount > 0;
        deadlineHtml = '<span class="pill ' + (isOverdue ? "off" : "pending") + '" style="margin-left:8px;"><span class="dot"></span>回答締切 ' + esc(formatDateShort(c.deadline)) + (isOverdue ? "(超過)" : "") + "</span>";
      }
      return '<div class="card" style="margin-bottom:12px;">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px;">' +
          "<div><strong>" + esc(formatDateJp(c.date)) + '</strong><span class="cell-note" style="margin-left:8px;">' + esc(timeRange(c.startTime, c.endTime)) + "</span>" + deadlineHtml + "</div>" +
          '<button type="button" class="btn btn-danger btn-sm" data-del-call="' + esc(c.id) + '">削除</button>' +
        "</div>" +
        (c.note ? '<div class="cell-note" style="margin-bottom:8px;">' + esc(c.note) + "</div>" : "") +
        '<div class="cell-note" style="margin-bottom:8px;">出勤可能 ' + availableCount + "件 ・ 休み希望 " + unavailableCount + "件 ・ 未回答 " + noResponseCount + "件</div>" +
        "<div>" + (rows || '<div class="empty-state">対象の講師がいません</div>') + "</div>" +
      "</div>";
    }).join("");

    el.querySelectorAll("[data-del-call]").forEach(function (b) {
      b.addEventListener("click", function () {
        onDangerClick(b, "もう一度押すと削除", function () {
          state.db.collection("shiftCalls").doc(b.getAttribute("data-del-call")).delete().then(function () { toast("削除しました"); });
        });
      });
    });
    el.querySelectorAll("[data-go-shift]").forEach(function (b) {
      b.addEventListener("click", function () {
        var call = byId(state.shiftCalls, b.getAttribute("data-go-shift"));
        var instId = b.getAttribute("data-go-inst");
        if (call) goCreateShiftFromResponse(call, instId);
      });
    });
  }
